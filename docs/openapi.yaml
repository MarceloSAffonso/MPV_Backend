openapi: 3.0.3
info:
  title: Terê Verde Online — API
  version: 1.0.0
  description: >
    API do MVP Back-End do Circuito Terê Verde (Teresópolis). Rotas públicas servem os visitantes;
    rotas /admin exigem sessão (cookie HttpOnly `tv_session`, JWT). DELETE realiza desativação
    (exclusão lógica), preservando histórico e auditoria.
servers:
  - url: https://tere-verde.tere-verde-online.workers.dev
  - url: http://localhost:5173
tags:
  - name: Público
  - name: Autenticação
  - name: Administração
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tv_session
  schemas:
    Error:
      type: object
      properties: { error: { type: string } }
    Attraction:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        category: { type: string, enum: [trilha, cachoeira, mirante, parque, biodiversidade] }
        summary: { type: string, maxLength: 240 }
        description: { type: string }
        location: { type: string }
        difficulty: { type: string, nullable: true, enum: [facil, moderada, dificil] }
        distance_km: { type: number, nullable: true }
        duration: { type: string, nullable: true }
        altitude_m: { type: integer, nullable: true }
        status: { type: string, enum: [aberta, fechada, manutencao], description: "No público, uma temporada fechada vigente sobrepõe este valor." }
        safety_notes: { type: string }
        image_key: { type: string, nullable: true }
        image_credit: { type: string, nullable: true }
        featured: { type: boolean }
    AttractionInput:
      type: object
      required: [name, category, summary, location, status]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        category: { type: string, enum: [trilha, cachoeira, mirante, parque, biodiversidade] }
        summary: { type: string, minLength: 10, maxLength: 240 }
        description: { type: string, maxLength: 4000 }
        location: { type: string }
        difficulty: { type: string, nullable: true, enum: [facil, moderada, dificil] }
        distance_km: { type: number, nullable: true }
        duration: { type: string, nullable: true }
        altitude_m: { type: integer, nullable: true }
        status: { type: string, enum: [aberta, fechada, manutencao] }
        safety_notes: { type: string }
        image_key: { type: string, nullable: true }
        image_credit: { type: string, nullable: true }
        featured: { type: boolean }
    Event:
      type: object
      required: [title, location, date, time, category, status]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        date: { type: string, format: date }
        time: { type: string, example: "08:00" }
        category: { type: string, enum: [caminhada, voluntariado, cultura, gastronomia, educacao] }
        status: { type: string, enum: [publicado, rascunho] }
        image_key: { type: string, nullable: true }
        attraction_id: { type: integer, nullable: true }
    Notice:
      type: object
      required: [title, message, severity]
      properties:
        id: { type: integer }
        title: { type: string }
        message: { type: string, maxLength: 500 }
        severity: { type: string, enum: [info, alerta, urgente] }
        attraction_id: { type: integer, nullable: true }
        active: { type: boolean }
    Season:
      type: object
      required: [name, kind, start_date, end_date]
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [alta, baixa, fechada] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        attraction_id: { type: integer, nullable: true, description: "null = circuito inteiro" }
        notes: { type: string }
  responses:
    Unauthorized:
      description: Sem sessão válida
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Invalid:
      description: Dados inválidos (mensagem em português)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Registro não encontrado
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
paths:
  /api/attractions:
    get:
      tags: [Público]
      summary: Lista atrações ativas
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [aberta, fechada, manutencao] } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Attraction" } } } } }
  /api/attractions/{slug}:
    get:
      tags: [Público]
      summary: Detalhe da atração com próximos eventos e temporadas
      parameters: [{ name: slug, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/events:
    get:
      tags: [Público]
      summary: Eventos publicados
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: past, in: query, schema: { type: string, enum: ["1"] }, description: "Inclui eventos passados" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Event" } } } } }
  /api/notices:
    get:
      tags: [Público]
      summary: Avisos ativos (exibidos no topo do site)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Notice" } } } } }
  /api/seasons:
    get:
      tags: [Público]
      summary: Temporadas em vigor ou futuras
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Season" } } } } }
  /api/media/{key}:
    get:
      tags: [Público]
      summary: Imagem armazenada no R2
      parameters: [{ name: key, in: path, required: true, schema: { type: string }, example: img/dedo-de-deus.jpg }]
      responses:
        "200": { description: Imagem }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/auth/login:
    post:
      tags: [Autenticação]
      summary: Login do administrador (limite de 5 tentativas a cada 10 min por IP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties: { email: { type: string, format: email }, password: { type: string } }
      responses:
        "200": { description: Sessão criada (cookie HttpOnly, SameSite=Strict, 8 h) }
        "401": { description: Credenciais incorretas }
        "429": { description: Muitas tentativas }
  /api/auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão
      responses: { "200": { description: OK } }
  /api/auth/me:
    get:
      tags: [Autenticação]
      summary: Usuário da sessão atual
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/admin/profile:
    get:
      tags: [Administração]
      summary: Dados da conta do administrador logado
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: "{ id, email, name }" }, "401": { $ref: "#/components/responses/Unauthorized" } }
    put:
      tags: [Administração]
      summary: Altera nome e e-mail (e-mail só com letras sem acento, números e . _ % + -); renova a sessão
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name: { type: string, minLength: 2, maxLength: 80, description: "Letras, espaços, apóstrofo, ponto e hífen" }
                email: { type: string, maxLength: 254, pattern: "^[a-z0-9._%+-]+@[a-z0-9-]+(\\.[a-z0-9-]+)+$" }
      responses:
        "200": { description: Atualizado }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: E-mail já usado por outro administrador }
  /api/admin/password:
    put:
      tags: [Administração]
      summary: Altera a senha (exige a senha atual; 5 tentativas erradas a cada 10 min)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 128, description: "Ao menos uma letra e um número; diferente da atual" }
      responses:
        "200": { description: Senha alterada }
        "400": { description: Senha atual incorreta ou nova senha inválida }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Muitas tentativas }
  /api/admin/stats:
    get:
      tags: [Administração]
      summary: Indicadores do painel
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /api/admin/attractions:
    get:
      tags: [Administração]
      summary: Lista atrações ativas (sem cache)
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthorized" } }
    post:
      tags: [Administração]
      summary: Cria atração
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AttractionInput" } } } }
      responses:
        "201": { description: Criada }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/admin/attractions/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Administração]
      summary: Atualiza atração
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AttractionInput" } } } }
      responses: { "200": { description: OK }, "400": { $ref: "#/components/responses/Invalid" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
    delete:
      tags: [Administração]
      summary: Desativa atração (exclusão lógica)
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Desativada }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/admin/attractions/{id}/status:
    patch:
      tags: [Administração]
      summary: Altera a disponibilidade (aberta, fechada, manutencao)
      security: [{ sessionCookie: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [aberta, fechada, manutencao] } } } } }
      responses: { "200": { description: OK }, "400": { $ref: "#/components/responses/Invalid" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/admin/events:
    get:
      tags: [Administração]
      summary: Lista eventos, inclusive rascunhos
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthorized" } }
    post:
      tags: [Administração]
      summary: Cria evento
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
      responses: { "201": { description: Criado }, "400": { $ref: "#/components/responses/Invalid" }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /api/admin/events/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Administração]
      summary: Atualiza evento
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } } }
      responses: { "200": { description: OK }, "400": { $ref: "#/components/responses/Invalid" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
    delete:
      tags: [Administração]
      summary: Desativa evento (exclusão lógica)
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Desativado }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/admin/notices:
    get:
      tags: [Administração]
      summary: Lista avisos
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthorized" } }
    post:
      tags: [Administração]
      summary: Cria aviso
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Notice" } } } }
      responses: { "201": { description: Criado }, "400": { $ref: "#/components/responses/Invalid" }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /api/admin/notices/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Administração]
      summary: Atualiza ou ativa/desativa aviso
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Notice" } } } }
      responses: { "200": { description: OK }, "400": { $ref: "#/components/responses/Invalid" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
    delete:
      tags: [Administração]
      summary: Desativa aviso (exclusão lógica)
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Desativado }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/admin/seasons:
    get:
      tags: [Administração]
      summary: Lista temporadas
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthorized" } }
    post:
      tags: [Administração]
      summary: Cria temporada (fim não pode ser anterior ao início)
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Season" } } } }
      responses: { "201": { description: Criada }, "400": { $ref: "#/components/responses/Invalid" }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /api/admin/seasons/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      tags: [Administração]
      summary: Atualiza temporada
      security: [{ sessionCookie: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Season" } } } }
      responses: { "200": { description: OK }, "400": { $ref: "#/components/responses/Invalid" }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
    delete:
      tags: [Administração]
      summary: Desativa temporada (exclusão lógica)
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: Desativada }, "401": { $ref: "#/components/responses/Unauthorized" }, "404": { $ref: "#/components/responses/NotFound" } }
  /api/admin/audit:
    get:
      tags: [Administração]
      summary: Últimas 100 alterações (quem, o quê, quando)
      security: [{ sessionCookie: [] }]
      responses: { "200": { description: OK }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /api/admin/upload:
    post:
      tags: [Administração]
      summary: Envia imagem ao R2 (JPG, PNG ou WebP, até 3 MB)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { multipart/form-data: { schema: { type: object, properties: { file: { type: string, format: binary } } } } }
      responses: { "200": { description: "{ key }" }, "413": { description: Maior que 3 MB }, "415": { description: Tipo não permitido } }
